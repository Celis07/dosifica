<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dosifica Rodilla</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sistema de planes de Manuel — hoja crema, barra coral, Oswald para títulos y DM Sans para texto, bloques por tipo de trabajo con su color, tabla Ejercicio/Series/Reps/Carga/Nota. Un solo tema claro, deliberado: es una hoja de plan. */
:root{
  --cream:#F0EEE9; --paper:#FFFFFF; --ink:#1C1B19; --muted:#6B6862; --line:#E0DDD6; --soft:#F7F6F2;
  --coral:#CC4D2C; --coral-soft:#F7E4DD; --green:#3D8A6A; --green-soft:#E1EFE8; --gold:#A07828; --gold-soft:#F4EBD7;
  --purple:#6B42B8; --purple-soft:#ECE6F7; --blue:#2F6F9F; --blue-soft:#E1ECF5; --dark:#24231F;
  --ok:#3D8A6A; --warn:#A07828; --bad:#B23A2A;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1340px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:4px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .bar{width:6px;height:30px;background:var(--coral);border-radius:2px}
.brand h1{font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
.brand span{font-size:.8rem;color:var(--muted)}
.pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
button:hover{border-color:var(--ink)}
button.primary{background:var(--coral);border-color:var(--coral);color:#fff}
button.dark{background:var(--dark);border-color:var(--dark);color:#fff}
button.ghost{background:transparent;border-style:dashed;color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
aside.form{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){aside.form{position:static;max-height:none}}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-family:var(--display);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--coral);padding:0;margin-bottom:4px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:.86rem}
.chk input{width:16px;height:16px;accent-color:var(--coral)}
.rng{display:flex;gap:10px;align-items:center}
.rng input{flex:1;accent-color:var(--coral)}
.rng output{font-family:var(--display);font-weight:600;min-width:2.8em;text-align:right}
hr.s{border:0;border-top:1px solid var(--line);margin:0}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.small{font-size:.82rem;color:var(--muted)}
.example{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;font-size:.86rem}
/* cabecera estilo plan */
.phead{display:grid;grid-template-columns:6px minmax(0,1fr);border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.phead .acc{background:var(--coral)}
.phead .in{padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
.trainer{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.client{font-family:var(--display);font-size:1.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.meta{font-size:.9rem;color:var(--muted)}
.badges{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.badge{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--coral);color:#fff;border-radius:6px;padding:5px 12px;font-size:.92rem}
.badge.dk{background:var(--dark)}
.phase{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.phase h2{font-family:var(--display);font-size:1.25rem;font-weight:600;letter-spacing:.03em;margin:0 0 4px;text-transform:uppercase}
.phase p{margin:0;max-width:70ch;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mods{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mod{font-size:.86rem;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
/* estado */
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.light{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:12px}
.light.g{background:var(--green-soft)} .light.y{background:var(--gold-soft)} .light.r{background:#F6DEDA}
.dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:4px}
.g .dot{background:var(--ok)} .y .dot{background:var(--warn)} .r .dot{background:var(--bad)}
.light b{display:block;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.light p{margin:2px 0 0;font-size:.86rem}
h3.sec{font-family:var(--display);font-size:.9rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
ul.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
ul.crit li{display:flex;gap:8px;align-items:baseline;font-size:.88rem}
.ck{font-weight:700;width:1.3em;flex:none;text-align:center}
.ck.y{color:var(--ok)} .ck.n{color:var(--bad)} .ck.u{color:var(--muted)}
ul.crit input{width:15px;height:15px;accent-color:var(--green);margin:0 .15em}
/* leyenda */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
/* días */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--dark);color:#fff;border-radius:8px;padding:10px 14px}
.dayhead h3{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:.1em;margin:0}
.dayhead span{font-size:.82rem;opacity:.8}
.blk{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.blk .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-left:5px solid var(--c);background:var(--cs)}
.blk .bh b{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.86rem;color:var(--c)}
.blk .bh i{font-style:normal;font-size:.78rem;color:var(--muted)}
.blk .bn{font-size:.82rem;color:var(--muted);padding:6px 12px 0}
.t-ter{--c:var(--green);--cs:var(--green-soft)} .t-afe{--c:var(--purple);--cs:var(--purple-soft)} .t-sano{--c:var(--coral);--cs:var(--coral-soft)}
.t-sup{--c:var(--coral);--cs:var(--coral-soft)} .t-core{--c:var(--ink);--cs:var(--soft)} .t-cardio{--c:var(--gold);--cs:var(--gold-soft)}
.tbl{overflow-x:auto}
table.pl{width:100%;border-collapse:collapse;font-size:.86rem;min-width:600px}
table.pl th{font-family:var(--display);font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
table.pl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.pl tr:last-child td{border-bottom:0}
table.pl td.e{font-weight:600;width:30%} table.pl td.n{color:var(--muted);font-size:.8rem;width:30%}
table.pl td.s,table.pl td.r{white-space:nowrap}
table.pl td.c{white-space:nowrap;color:var(--coral);font-weight:600}
table.pl input{border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:.84rem;background:var(--soft)}
table.pl td.x{width:28px;padding:5px 4px}
.xbtn{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:0 6px;line-height:1}
.xbtn:hover{color:var(--bad)}
.addrow{display:flex;padding:6px 10px 8px}
.edited{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--purple-soft);border-radius:8px;padding:8px 12px;font-size:.86rem}
/* tabla resumen */
table.data{width:100%;border-collapse:collapse;font-size:.84rem}
table.data th,table.data td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th{font-family:var(--display);font-weight:500;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
/* evidencia */
details.ev{margin-top:8px;font-size:.84rem}
details.ev summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.8rem;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.ev summary::-webkit-details-marker{display:none}
details.ev summary::before{content:"+";display:inline-block;width:1em;font-weight:700}
details.ev[open] summary::before{content:"–"}
details.ev ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.lv{font-family:var(--display);font-size:.7rem;font-weight:600;border-radius:4px;padding:0 5px;margin-right:4px}
.lv.A{background:var(--green-soft);color:var(--green)} .lv.B{background:var(--purple-soft);color:var(--purple)} .lv.C{background:var(--gold-soft);color:var(--gold)} .lv.E{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.ref-k{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mini{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.mini h4{margin:0 0 4px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.88rem}
.mini p{margin:4px 0;font-size:.86rem}
details#refs > summary{cursor:pointer;list-style:none;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.9rem}
details#refs > summary::-webkit-details-marker{display:none}
details#refs ol{font-size:.84rem;display:flex;flex-direction:column;gap:6px;padding-left:20px}
.lvleg{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--dark);color:#fff;padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;background:#F6DEDA;border-radius:8px;padding:8px 10px;margin-bottom:12px}
.savestate{font-size:.78rem;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--line);padding-bottom:0}
.tabs button{border:0;border-radius:7px 7px 0 0;background:transparent;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);padding:9px 14px;margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral);background:var(--paper)}
.badge.lt{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-size:.78rem}
.warnchip{display:inline-block;margin-top:8px;font-size:.8rem;background:#F6DEDA;color:var(--bad);border-radius:6px;padding:3px 8px}
.t-esp{--c:var(--blue);--cs:var(--blue-soft)}
.cue{font-size:.76rem;color:var(--muted);font-weight:400;margin-top:2px}
.sug{font-size:.76rem;color:var(--green);font-weight:600;margin-top:2px}
table.pl td.e a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
table.pl td.v input{width:9em}
.mini-btn{font-size:.74rem;padding:3px 7px;border-radius:5px;margin-right:4px}
.subrow td{background:var(--soft)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:.82rem;max-width:260px}
.pick i{font-style:normal;font-weight:400;color:var(--muted);font-size:.74rem}
.lbtn{background:var(--coral);border-color:var(--coral);color:#fff;font-size:.8rem;padding:5px 10px}
.logf{margin-top:10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.logf h4{margin:0;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:.88rem}
.row5{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.meso{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mw{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;display:flex;flex-direction:column;gap:2px;background:var(--soft)}
.mw b{font-family:var(--display);font-weight:600;letter-spacing:.05em;font-size:.85rem}
.mw span{color:var(--muted)}
.mw.on{border:2px solid var(--coral);background:var(--coral-soft)}
.mw.dl b{color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{font-family:var(--display);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:.8rem;color:var(--muted)}
td.wrap{white-space:normal!important;min-width:200px;font-size:.78rem}
.up{color:var(--green);font-weight:600;font-size:.76rem} .down{color:var(--bad);font-weight:600;font-size:.76rem}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.pill{font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:99px} .pill.g{background:var(--green-soft);color:var(--green)} .pill.r{background:#F6DEDA;color:var(--bad)}
.foot{font-size:.78rem;color:var(--muted);text-align:center;padding-block:8px}
code{font-size:.8rem;background:var(--soft);padding:1px 5px;border-radius:4px}

[hidden]{display:none!important}
img{max-width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.logcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.logcard form{display:flex;flex-direction:column;gap:10px}
.req{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;background:var(--soft)}
.req p{margin:6px 0}
.reqh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill.y{background:var(--gold-soft);color:var(--gold)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="login" class="login" hidden>
  <div class="logcard">
    <div class="brand"><div class="bar"></div><h1>Dosifica · Rodilla</h1></div>
    <p>Entra con tu correo. Te enviamos un enlace para iniciar sesión, sin contraseña.</p>
    <form id="loginForm"><label class="f">Correo<input type="email" id="loginEmail" autocomplete="email" required></label>
    <button class="primary" id="loginBtn" type="submit">Enviarme el enlace</button></form>
    <p class="small" id="loginMsg"></p>
  </div>
</div>
<div id="athleteApp" class="wrap" hidden></div>
<div id="fisioApp" hidden>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="bar"></div><h1>Dosifica · Rodilla</h1><span>rehabilitación de rodilla por RPE basada en evidencia</span></div>
  <div class="pbar">
    <span class="savestate" id="saveState"></span>
    <span class="small" id="who"></span><button id="fOut">Salir</button>
    <select id="psel" aria-label="Paciente"></select>
    <button id="bNew">Nuevo paciente</button>
    <button id="bDel">Eliminar</button>
  </div>
</header>
<div id="delConfirm" hidden class="confirm"><span id="delTxt"></span><button id="bDelYes" class="primary">Sí, eliminar</button><button id="bDelNo">Cancelar</button></div>

<div class="grid">
<aside class="form" id="form">
  <fieldset>
    <legend>Deportista</legend>
    <label class="f">Nombre<input type="text" id="nombre" data-k="nombre"></label>
    <label class="f">Correo del deportista (para entrar a su portal)<input type="email" id="pemail" data-k="email" autocomplete="off"></label>
    <div class="row2">
      <label class="f">Deporte<input type="text" id="deporte" data-k="deporte"></label>
      <label class="f">Rodilla afectada<select id="lado" data-k="lado"><option value="der">Derecha</option><option value="izq">Izquierda</option></select></label>
    </div>
    <label class="f">Perfil deportivo para el retorno<select id="perfil" data-k="perfil"><option value="">Sin perfil específico</option><option value="uwr">Rugby subacuático</option><option value="futbol">Fútbol</option><option value="cancha">Baloncesto o voleibol</option><option value="carrera">Carrera</option><option value="natacion">Natación</option></select></label>
    <label class="chk"><input type="checkbox" id="consent" data-k="consent"> Consentimiento informado para tratar datos de salud firmado</label>
    <div class="small" id="pidRow"></div>
  </fieldset>
  <hr class="s">
  <fieldset>
    <legend>Diagnóstico</legend>
    <label class="f">Condición<select id="cond" data-k="cond">
      <option value="tend">Tendinopatía</option><option value="pfp">Dolor patelofemoral</option><option value="men">Meniscopatía</option><option value="lca">Ligamento cruzado anterior</option></select></label>
    <label class="f" data-show="tend">Tendón<select id="tendSub" data-k="tendSub"><option value="rot">Rotuliano</option><option value="quad">Cuadricipital</option></select></label>
    <label class="f" data-show="men">Situación<select id="menSub" data-k="menSub">
      <option value="cons">Conservador (sospecha clínica / imagen)</option><option value="mx">Postoperatorio · meniscectomía</option><option value="sut">Postoperatorio · sutura meniscal</option></select></label>
    <label class="f" data-show="sut">Carga indicada por el cirujano<select id="cargaSut" data-k="cargaSut"><option value="restringida">Restringida (4–6 sem)</option><option value="inmediata">Inmediata según tolerancia</option></select></label>
    <label class="f" data-show="lca">Situación<select id="lcaSub" data-k="lcaSub">
      <option value="cons">No operado · manejo conservador</option><option value="pre">Preoperatorio (prehabilitación)</option><option value="post">Postoperatorio</option></select></label>
    <div class="row2" data-show="lcapost">
      <label class="f">Injerto<select id="injerto" data-k="injerto"><option value="hth">Hueso-tendón-hueso</option><option value="isq">Isquiotibiales</option><option value="qt">Tendón cuadricipital</option><option value="allo">Aloinjerto</option></select></label>
      <label class="f">Semanas postop<input type="number" id="semanas" data-k="semanas" min="0" max="104"></label>
    </div>
    <label class="chk" data-show="lcapost"><input type="checkbox" id="suturaAsoc" data-k="suturaAsoc"> Sutura meniscal asociada</label>
    <label class="f" data-show="menpost">Semanas postop<input type="number" id="semanasM" data-k="semanas" min="0" max="104"></label>
    <label class="f">Fase<select id="fase" data-k="fase"></select></label>
    <div class="row2">

const ALTMAP = Object.fromEntries(ALT.map(a=>[a.n,a]));
function classify(name){
  const n=(name||'').toLowerCase();
  if(ALTMAP[name]) return ALTMAP[name].pat;
  if(/isom|spanish/.test(n)) return 'iso';
  if(/salto|pogo|aterrizaj|hop|pliom|drop jump/.test(n)) return 'plio';
  if(/extensión de rodilla|tke|extensión terminal/.test(n)) return 'okc';
  if(/búlgara|step|split|unilateral 0|prensa unilateral/.test(n)) return 'uni';
  if(/sentadilla|prensa/.test(n)) return 'domr';
  if(/peso muerto|hip thrust|puente/.test(n)) return 'domc';
  if(/curl femoral|nórdico/.test(n)) return 'isq';
  if(/abducci|glúteo|marcha lateral|clamshell/.test(n)) return 'glu';
  if(/talón|talones|gemel/.test(n)) return 'pant';
  if(/unipodal|estabilidad|perturbaci|balance/.test(n)) return 'est';
  if(/^bici|^remo(?! con)|ergómetro|carrera/.test(n)) return 'cardio';
  if(/plancha|pallof|dead bug|hollow|granjero/.test(n)) return 'core';
  if(/press banca|mancuernas en banco|flexiones/.test(n)) return 'sup-eh';
  if(/dominada|jalón/.test(n)) return 'sup-tv';
  if(/press de hombro/.test(n)) return 'sup-ev';
  if(/remo con|remo a una/.test(n)) return 'sup-th';
  return null;
}

const STAGES = {tend:['mid','mid','late','late'],pfp:['mid','mid','late'],'men-cons':['early','mid','late','late'],'men-mx':['early','mid','late'],'men-sut':['early','early','mid','late'],'lca-cons':['early','mid','late','late'],'lca-pre':['mid'],'lca-post':['early','early','mid','late','late']};
function constraints(s){
  const key=pkey(s), i=phaseIdx(s), stage=STAGES[key][i];
  let fx=140; if(key==='men-sut'&&i===0) fx=90; if(key==='men-sut'&&i===1) fx=70; if(key==='lca-post'&&s.suturaAsoc&&i<=1) fx=90;
  if(key==='lca-post'&&i===0) fx=Math.min(fx,60);
  let tn=2; if(key==='tend'&&i===0) tn=1; if(key==='pfp'&&i===0) tn=1;
  return {fx, tn, im: stage==='late' ? 1 : 0};
}
function dailyTherapy(key, i, s){
  const stage = STAGES[key][i];
  const flexLim = (key==='men-sut' && i<=1) || (key==='lca-post' && s.suturaAsoc && i<=1);
  let items;
  if(stage==='early') items = [
    s.derrame>=1 ? X('Control del derrame','1 × 10–15 min',{t:'Compresión y elevación después de la sesión o en casa.'}) : null,
    X('Extensión pasiva con talón elevado','3 × 2 min'),
    X('Flexión asistida (deslizamiento de talón)', flexLim ? '2 × 15' : '2 × 15',{t: flexLim ? 'Máximo 90°.' : 'Ganando rango cada día.'}),
    X('Isometría de cuádriceps a 0° y 60°','5 × 10 s',{rpe:'8'}),
    X('Elevación de pierna recta','2 × 15',{rpe:'6'}),
    X('TKE con banda','2 × 20',{rpe:'6'})
  ];
  else if(stage==='mid') items = [
    X('Movilidad de rodilla, cadera y tobillo','1 × 5 min'),
    X('Isometría de cuádriceps a 60°','3 × 30 s',{rpe:'7'}),
    X('TKE con banda','2 × 20',{rpe:'6'}),
    X('Apoyo unipodal con perturbación','3 × 30 s')
  ];
  else items = [
    X('Movilidad dinámica','1 × 5 min'),
    X('Activación: isometría a 60° + TKE','2 × 20 s + 20 reps',{rpe:'6'}),
    X('Saltos de tobillo (pogo)','2 × 15',{rpe:'6'}),
    X('Aterrizajes controlados','2 × 5',{t:'Aterrizaje silencioso, rodilla alineada sobre el pie.'})
  ];
  if(key==='tend' && i<=1) items = [ISO_TEND, ...items.filter(x=>x && !/^Isometría/.test(x.n))];
  if(key==='pfp' && i===0) items = items.filter(x=>x && !/^Saltos|^Aterrizajes/.test(x.n));
  return items.filter(Boolean);
}
function allKnee(ph){ return ph.blocks.flatMap(b=>b.items); }
function liftsOnly(ph){ return allKnee(ph).filter(it=>it.lift); }
function lightKnee(ph){
  const out = allKnee(ph).filter(it=>!it.lift && !/^Isometr/.test(it.n));
  if(ph.tools.includes('bfr')) out.unshift(X('BFR · prensa o extensión unilateral','4 × 30-15-15-15',{rpe:'7–8',t:'Carga muy ligera, 30 s de pausa. 60–80 % de la presión de oclusión, solo con manguito que la mida.'}));
  if(!out.length) out.push(X('Apoyo unipodal con perturbación','4 × 30–45 s'));
  return out;
}
function sanoItems(kind, light){
  if(kind==='cx'){
    if(light) return [X('Isometría máxima de extensión a 60°','4 × 5 s',{rpe:'10',t:'Día corto: estímulo neural con poca fatiga.'})];
    return [
      X('Extensión de rodilla unilateral','3 × 4–6',{rpe:'8',t:'Pausa 2–3 min. Sin llegar al fallo.'}),
      X('Prensa unilateral','2 × 5–6',{rpe:'8'}),
      X('Curl femoral unilateral','3 × 6–8',{rpe:'8'}),
      X('Isometría máxima de extensión a 60°','4 × 5 s',{rpe:'10',t:'Al final del bloque, máxima intención.'}),
      X('Elevación de talón unilateral','3 × 8–10',{rpe:'8'})];
  }
  if(light) return [X('Elevación de talón unilateral','3 × 8–10',{rpe:'8'})];
  return [
    X('Prensa unilateral','3 × 3–5',{rpe:'8–9'}),
    X('Extensión de rodilla unilateral','3 × 6–8',{rpe:'8'}),
    X('Sentadilla búlgara (sano adelante)','3 × 4–6',{rpe:'8',t:'Solo si la rodilla afectada tolera ir atrás con flexión ≥ 100°.'}),
    X('Peso muerto rumano unilateral','3 × 6–8',{rpe:'8'})];
}
function upperItems(type, stage){
  const early = stage==='early';
  if(type==='A') return [
    early ? X('Press con mancuernas en banco','4 × 5–6',{rpe:'8',t:'Pies apoyados en el banco.'}) : X('Press banca','4 × 4–6',{rpe:'8'}),
    early ? X('Jalón al pecho','4 × 6–8',{rpe:'8'}) : X('Dominadas (lastradas si hace más de 8)','4 × 5–8',{rpe:'8'}),
    X('Press inclinado con mancuernas','3 × 8–10',{rpe:'8'}),
    X('Face pull','3 × 12–15',{rpe:'7–8'})];
  return [
    early ? X('Press de hombro sentado con respaldo','4 × 6–8',{rpe:'8'}) : X('Press de hombro de pie o landmine','4 × 6–8',{rpe:'8'}),
    X('Remo con pecho apoyado','4 × 6–8',{rpe:'8'}),
    X('Press cerrado en banco','3 × 8–10',{rpe:'8'}),
    X('Curl de bíceps + extensión de tríceps en superserie','3 × 10–12',{rpe:'8'})];
}
function coreItems(type, stage){
  const L = {
    early:[X('Dead bug','3 × 8 por lado',{rpe:'6–7'}),X('Pallof press sentado','3 × 10 por lado',{rpe:'7'}),X('Hollow hold','3 × 20–30 s',{rpe:'7'})],
    mid:[X('Plancha frontal','3 × 30–45 s',{rpe:'7'}),X('Plancha lateral','3 × 20–40 s por lado',{rpe:'7',t:'Doble función: core y glúteo medio.'}),X('Pallof press de pie','3 × 10 por lado',{rpe:'8'})],
    late:[X('Pallof press con rotación','3 × 8 por lado',{rpe:'8'}),X('Caminata de granjero unilateral','3 × 20–30 m',{rpe:'8'}),X('Plancha con arrastre','3 × 8 por lado',{rpe:'7'})]
  }[stage];
  return type==='A' ? L.slice(0,2) : L.slice(1,3);
}
function cardioItem(ph, s, kind){
  const fl=num(s.flexL), cx=ph.cx;
  const bike = cx.bici==='uni' ? 'uni' : (fl!=null && fl<110) || (cx.bici==='cond' && fl==null) ? 'partial' : 'full';
  const row = cx.remo==='no' ? 'no' : cx.remo==='brazos' ? 'brazos' : (fl==null || fl<120 || cx.remo==='cond') ? 'cond' : 'full';
  const allowed = {base:0,int:1,sprint:2}[cx.int], want = {base:0,int:1,sprint:2}[kind];
  const k = ['base','int','sprint'][Math.min(allowed,want)];
  const D = {base:['1','25–35 min','3–4','Ritmo en el que puede hablar.'], int:['4–6','4 min','7–8','2 min suave entre series.'], sprint:['6–10','15–20 s','9–10','2–3 min suave entre series.']}[k];
  if(bike==='full') return X('Bici', `${D[0]} × ${D[1]}`, {rpe:D[2], t:D[3]+(row==='full'?' Alternativa: remo con la misma dosis.':'')});
  if(row==='full') return X('Remo', `${D[0]} × ${D[1]}`, {rpe:D[2], t:D[3]});
  if(bike==='uni') return X('Bici unipodal con el sano', k==='base'?'1 × 20–30 min':'4–6 × 4 min', {rpe:k==='base'?'4–5':'6–7', t:'Pierna afectada apoyada en un taburete.'+(row==='brazos'?' Alternativa: remo solo brazos 6–10 × 1 min a RPE 7.':'')});
  if(bike==='partial') return X('Bici con sillín alto (medio pedaleo)', k==='base'?'1 × 20–25 min':'4–6 × 3 min', {rpe:k==='base'?'3–4':'6–7', t:`La vuelta completa necesita ~110° de flexión${fl!=null?` (hoy ${fl}°)`:''}.`});
  return X('Remo solo brazos y tronco','6–10 × 1 min',{rpe:'7',t:'1 min suave entre series. Piernas fijas.'});
}
function toRow(it){
  const m = it.d.match(/^(\d+(?:–\d+)?)\s*×\s*([^·]+?)\s*(?:·\s*(.+))?$/);
  let s='', r=it.d, extra='';
  if(m){ s=m[1]; r=m[2].trim(); extra=m[3]||''; }
  return {e:it.n, s, r, c: it.rpe ? 'RPE '+it.rpe : '', n:[extra, it.t].filter(Boolean).join('. ')};
}
const SEGS = {ter:'Terapia y activación', afe:'Rehabilitación · rodilla afectada', esp:'Retorno específico al deporte', sano:'Fuerza · miembro sano', sup:'Fuerza · miembro superior', core:'Core', cardio:'Cardio · bici y remo'};
function genWeek(s){
  const key=pkey(s), i=phaseIdx(s), ph=P[key].phases[i];
  const n = s.dias==='4' ? 4 : 3, stage = STAGES[key][i];
  const perfil = PERFILES[s.perfil||''];
  const espDays = stage==='late' && perfil.items ? (n===3 ? [1] : [1,3]) : [];
  const days=[];
  for(let d=0; d<n; d++){
    const heavy = n===3 ? true : (d===0 || d===2);
    let knee, sub;
    if(n===3){ knee = d===1 ? liftsOnly(ph) : allKnee(ph); sub = d===1 ? 'fuerza' : 'sesión completa'; if(knee.length<3){ knee=allKnee(ph); sub='sesión completa'; } }
    else { knee = heavy ? allKnee(ph) : lightKnee(ph); sub = heavy ? 'sesión completa' : 'ligera'; }
    const ther = dailyTherapy(key,i,s);
    const tKeys = ther.map(t=>t.n.slice(0,14).toLowerCase());
    knee = knee.filter(it=> it!==ISO_TEND && !tKeys.includes(it.n.slice(0,14).toLowerCase()));
    if(!knee.length) knee=[X('Sin bloque adicional','La terapia del día cubre la rodilla')];
    const sanoLight = n===4 && !heavy;
    const up = n===3 ? (d===1?'B':'A') : (d%2===0?'A':'B');
    const cardioKind = n===3 ? ['base','int','sprint'][d] : ['base','int','base','sprint'][d];
    const segs = [
      {type:'ter', sub:'todos los días', rows:dailyTherapy(key,i,s).map(toRow)},
      {type:'afe', sub, rows:knee.map(toRow)}
    ];
    if(espDays.includes(d)) segs.push({type:'esp', sub:perfil.l.toLowerCase(), rows:perfil.items.map(toRow)});
    segs.push(
      {type:'sano', sub: sanoLight?'corto':(ph.sano==='cx'?'educación cruzada':'referencia'), rows:sanoItems(ph.sano, sanoLight).map(toRow)},
      {type:'sup', sub: up==='A'?'empuje horizontal y tracción vertical':'empuje vertical y tracción horizontal', rows:upperItems(up, stage).map(toRow)},
      {type:'core', sub:'', rows:coreItems(up, stage).map(toRow)},
      {type:'cardio', sub:{base:'base aeróbica',int:'intervalos',sprint:'sprints'}[cardioKind], rows:[toRow(cardioItem(ph,s,cardioKind))]}
    );
    days.push({name:`Día ${d+1}`, segs});
  }
  return days;
}
function baseWeek(s){ const k=planKey(s); return s.plans?.[k] ? {days:s.plans[k], custom:true} : {days:genWeek(s), custom:false}; }

/* ===================== MESOCICLO ===================== */
const MESO = [
  {w:1, l:'Introducción', d:'RPE un punto por debajo del objetivo: aprender los ejercicios y encontrar las cargas.', rpe:-1, ser:0},
  {w:2, l:'Carga', d:'Dosis objetivo.', rpe:0, ser:0},
  {w:3, l:'Sobrecarga', d:'Una serie más en los ejercicios principales, mismo RPE.', rpe:0, ser:1},
  {w:4, l:'Descarga', d:'≈ 40–50 % menos series y un punto menos de RPE para consolidar.', rpe:-1, ser:-0.4}
];
const mesoWeek = s => MESO[((Math.max(1,num(s.semPlan)||1)-1)%4)];
function adjSeries(str, ser, main){
  if(!str || !ser) return str;
  return str.replace(/\d+/g, x=>{ const v=+x; if(ser<0) return String(Math.max(1, Math.round(v*(1+ser)))); return main && v>=2 ? String(Math.min(6, v+ser)) : x; });
}
function adjRPE(str, d){
  if(!str || !d) return str;
  return str.replace(/RPE\s*([\d–]+)/, (m,g)=> 'RPE '+g.split('–').map(x=>String(Math.max(5,Math.min(10,+x+d)))).join('–'));
}
function applyMeso(days, s){
  const m = mesoWeek(s);
  if(!m.rpe && !m.ser) return days;
  const out = clone(days);
  out.forEach(d=>d.segs.forEach(sg=>{
    if(sg.type==='ter') return;
    sg.rows.forEach(r=>{
      const main = /RPE\s*(8|9|10)/.test(r.c) && ['afe','sano','sup'].includes(sg.type);
      if(sg.type!=='cardio' || m.ser<0) r.s = adjSeries(r.s, m.ser, main);
      if(sg.type!=='cardio' && !/RPE 10/.test(r.c)) r.c = adjRPE(r.c, m.rpe);
    });
  }));
  return out;
}
function viewWeek(s){ const b=baseWeek(s); return {days: editMode ? b.days : applyMeso(b.days, s), custom:b.custom}; }

/* ===================== SUGERENCIAS DESDE EL REGISTRO ===================== */
function lastFor(name){
  const sorted = sessions.slice().sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  for(const ses of sorted){ const e=(ses.ex||[]).find(x=>x.e===name && (x.kg||x.rpe)); if(e) return {...e, fecha:ses.fecha}; }
  return null;
}
function suggestion(row){
  const l = lastFor(row.e); if(!l) return '';
  const tgt = (row.c.match(/RPE\s*(\d+)/)||[])[1]; const real = num(l.rpe);
  let act='';
  if(tgt && real!=null){ const t=+tgt; act = real<=t-1 ? 'sube la carga 2,5–5 %' : real>=t+1 ? 'baja la carga 5–10 %' : 'mantén y suma 1 repetición'; }
  return `Última: ${l.kg?l.kg+' kg':''}${l.reps?' × '+l.reps:''}${real!=null?' a RPE '+real:''}${act?' → '+act:''}`;
}

/* ===================== BIBLIOTECA Y VIDEOS ===================== */
let myLib = [], myMeta = {};
const BASE = new Set();
function collectBase(){
  Object.values(P).forEach(p=>p.phases.forEach(ph=>allKnee(ph).forEach(it=>BASE.add(it.n))));
  ['early','mid','late'].forEach(sg=>{ ['A','B'].forEach(t=>{ upperItems(t,sg).forEach(i=>BASE.add(i.n)); coreItems(t,sg).forEach(i=>BASE.add(i.n)); }); });
  ['cx','late'].forEach(k=>[true,false].forEach(l=>sanoItems(k,l).forEach(i=>BASE.add(i.n))));
  Object.values(PERFILES).forEach(p=>(p.items||[]).forEach(i=>BASE.add(i.n)));
  ALT.forEach(a=>BASE.add(a.n));
}
function renderLib(){ const all=[...new Set([...myLib, ...BASE])].sort((a,b)=>a.localeCompare(b,'es')); $('#exlib').innerHTML = all.map(n=>`<option value="${esc(n)}"></option>`).join(''); }
const cueOf = n => myMeta[n]?.cue || ALTMAP[n]?.cue || '';
const videoOf = n => { const v=myMeta[n]?.video||''; return /^https?:\/\//i.test(v) ? v : ''; };
function candidates(name, s){
  const pat = classify(name); if(!pat) return [];
  const c = constraints(s);
  return ALT.filter(a=>a.pat===pat && a.n!==name && a.fx<=c.fx && a.tn<=c.tn && a.im<=c.im);
}
/* ===================== PIEZAS DE RENDER ===================== */
function refList(keys){

}
function critList(ids, s){

function painLight(s){

const isLoggable = (sg,r) => ['afe','sano','sup','esp'].includes(sg.type) && /RPE/.test(r.c||'');

function mesoCard(s){
  const m=mesoWeek(s), w=num(s.semPlan)||1, blk=Math.floor((w-1)/4)+1;
  return `<section class="card"><h3 class="sec">Mesociclo ${blk} · semana ${m.w} de 4</h3>
    <div class="meso">${MESO.map(x=>`<div class="mw${x.w===m.w?' on':''}${x.w===4?' dl':''}"><b>S${x.w} · ${x.l}</b><span>${esc(x.d)}</span></div>`).join('')}</div>
    <p class="small" style="margin:8px 0 0">El plan se ajusta solo según la semana del plan. Al terminar la descarga, reevalúa criterios antes de empezar el siguiente bloque. ${editMode?'Estás editando la semana base; la progresión se aplica encima.':''}</p>
    ${refList(['helms','exp'])}</section>`;
}
function fundamentos(ph, s){
  const kneeEv = [...new Set(ph.blocks.flatMap(b=>b.ev))];
  const four = s.dias==='4';
  return `<section class="card"><h3 class="sec">Fundamento del plan</h3>
  <div class="mods">
    <div class="mod"><b>Carga por RPE.</b> RPE 8 = podría hacer 2 repeticiones más; RPE 7 = 3 más. El peso se ajusta cada sesión para caer en el RPE objetivo; la app compara el RPE real registrado con el objetivo y sugiere el ajuste. ${refList(['helms'])}</div>
    <div class="mod"><b>Orden de la sesión.</b> Terapia → rodilla afectada → retorno específico → sano → superior → core → cardio. La rodilla afectada se entrena sin fatiga previa (criterio clínico).</div>
    <div class="mod"><b>Reparto de la rodilla afectada.</b> ${four ? 'Con 4 días, la sesión completa va en los días 1 y 3, y los días 2 y 4 son ligeros. En tendinopatía el ensayo de carga pesada lenta usó 3 sesiones por semana: si el tendón lo tolera, añade la prensa también el día 2.' : 'Con 3 días, la fuerza va los tres días y lo que no es fuerza (pliometría, estabilidad, técnica) va los días 1 y 3.'} ${refList(kneeEv)}</div>
    <div class="mod"><b>Miembro sano.</b> ${ph.sano==='cx' ? 'Alta intensidad (RPE 8, sin fallo) con un tope de 15 series duras por semana para los extensores de rodilla del sano. El tope es mi criterio, no un dato de ensayo.' : 'Fase tardía: el sano sigue entrenando fuerte como referencia exigente.'} ${refList(ph.sano==='cx'?['minshull','zhang25','zult']:['wellsandt'])}</div>
    <div class="mod"><b>Retorno específico al deporte.</b> Aparece en las fases tardías según el perfil deportivo. Casi todo es experiencia clínica (nivel E); el marco general viene del retorno en campo. ${refList(['buckthorpe19','exp'])}</div>
    <div class="mod"><b>Superior, core y cardio.</b> Básicos a RPE 8, accesorios a 8–15 reps; en fase temprana todo sentado o apoyado y sin arrodillarse. La bici bipodal requiere ~110° de flexión y el remo completo ~120°. ${refList(['helms','abbiss','fleming','exp'])}</div>
  </div></section>`;
}
function toolsBlock(ph){
  const out=[];
  if(ph.tools.includes('iso')) out.push(`<div class="mini"><h4>Isometría analgésica</h4><p><b>Dosis:</b> 5 × 45 s a ~70 % de una contracción máxima (RPE 6–7), rodilla a 60°, 2 min de pausa.</p><p><b>Evidencia:</b> analgesia inmediata en el estudio original (n = 6), sin ventaja frente a la carga isotónica en los metaanálisis. Úsala si le funciona al deportista.</p>${refList(['rio','clifford','challoumas'])}</div>`);
  if(ph.tools.includes('bfr')) out.push(`<div class="mini"><h4>BFR</h4><p>Manguito en la parte alta del muslo; con cargas muy ligeras logra ganancias de fuerza parecidas a las de cargas altas, con menos dolor.</p><p><b>Dosis:</b> 30-15-15-15 reps, 30 s de pausa, 60–80 % de la presión de oclusión. Cribado de riesgo trombótico y manguito que mida la presión.</p>${refList(['hughes19','hughes19p','curran','patterson'])}</div>`);
  if(ph.tools.includes('mi')) out.push(`<div class="mini"><h4>Imaginería y observación</h4><p><b>Dosis:</b> 10–15 min, 3–5 × semana en casa.</p><p><b>Evidencia:</b> mecanismo plausible, sin beneficio añadido claro. Coste cero, riesgo cero.</p>${refList(['pastora','paravlic'])}</div>`);
  if(!out.length) return '';
  return `<section class="card"><h3 class="sec">Herramientas complementarias</h3><div class="cols">${out.join('')}</div></section>`;
}
function allRefs(){
  return `<section class="card"><details id="refs"><summary>Referencias y niveles de evidencia</summary>
  <div class="lvleg">${Object.entries(LV).map(([k,v])=>`<span><span class="lv ${k}">${k}</span>${v}</span>`).join('')}</div>
  <ol>${Object.entries(R).filter(([k])=>k!=='exp').map(([k,r])=>`<li><span class="lv ${r.l}">${r.l}</span>${esc(r.c)}</li>`).join('')}</ol></details></section>`;
}

function planView(){
  const key=pkey(st), P0=P[key], i=phaseIdx(st), ph=P0.phases[i];
  const {days, custom} = viewWeek(st);

  const mods=[];
  if(key==='lca-post'){ const g=GRAFT[st.injerto]; mods.push(`<div class="mod"><b>${g.t}.</b> ${esc(g.m)} ${refList(g.ev)}</div>`);
    if(st.suturaAsoc) mods.push(`<div class="mod"><b>Sutura meniscal asociada.</b> Manda la restricción más conservadora: flexión ≤ 90° y sin curl femoral cargado hasta ~6 semanas, bici bipodal cuando haya 110°, y sin carga en flexión > 90° hasta ~12–16 semanas. ${refList(['mohamadi','ojsm25'])}</div>`); }
  if(key==='men-sut') mods.push(`<div class="mod"><b>Carga ${st.cargaSut==='inmediata'?'inmediata según tolerancia':'restringida 4–6 semanas'}.</b> ${st.cargaSut==='inmediata'?'Las revisiones no muestran más fallos con carga acelerada en roturas estables; aun así, limita la flexión en carga.':'Respeta la descarga indicada; trabaja activación en cadena abierta y el miembro sano duro.'} ${refList(['mohamadi','ojsm25'])}</div>`);
  if(key==='tend' && st.tendSub==='quad') mods.push(`<div class="mod"><b>Tendón cuadricipital.</b> Casi toda la evidencia es de tendinopatía rotuliana; aquí se extrapola (nivel C). Suele irritarse en flexión profunda: empieza con rangos medios.</div>`);
  if(key==='men-cons') mods.push(`<div class="mod"><b>Sin resonancia.</b> Tratar por sospecha clínica es razonable porque el manejo inicial es el mismo: ejercicio. ${refList(['skou','kise'])}</div>`);
  if(key==='pfp') mods.push(`<div class="mod"><b>Dolor patelofemoral.</b> La base es ejercicio combinado de cadera y rodilla; en corredores, reentrenar la carrera. ${refList(['willy19','crossley16'])}</div>`);
  if(ph.avoid) mods.push(`<div class="mod"><b>Evitar en esta fase.</b> ${esc(ph.avoid)}</div>`);
  if(ph.note) mods.push(`<div class="mod">${esc(ph.note)}</div>`);
  const sug = suggested(st);
  const time = P0.weeks ? `Semana postop ${num(st.semanas)||0} · por tiempo correspondería ${esc(P0.phases[sug].name.split(' · ')[0].toLowerCase())}` : 'Fase elegida por criterios';
  const nd = days.length;
  const overview = `<div class="tbl"><table class="data"><thead><tr><th>Día</th><th>Rodilla afectada</th><th>Deporte</th><th>Sano</th><th>Superior</th><th>Cardio</th></tr></thead><tbody>
    ${days.map(d=>{ const g=t=>d.segs.find(x=>x.type===t); return `<tr><td><b>${esc(d.name)}</b></td><td>${esc(g('afe')?.sub||'—')}</td><td>${g('esp')?'✓':'—'}</td><td>${esc(g('sano')?.sub||'—')}</td><td>${esc(g('sup')?.sub||'—')}</td><td>${esc(g('cardio')?.rows?.[0]?.e||'—')} · ${esc(g('cardio')?.sub||'')}</td></tr>`; }).join('')}
    </tbody></table></div><p class="small" style="margin:8px 0 0">Reparto sugerido: ${nd===4?'lunes, martes, jueves y viernes':'lunes, miércoles y viernes'}. Terapia y activación todos los días.</p>`;
  return `
  <section class="card"><div class="status">
    <div class="light ${light.c}"><span class="dot"></span><div><b>${light.t}</b><p>${esc(light.p)}</p>${sessions.length?`<p class="small">Según la última sesión registrada.</p>`:''}</div></div>
    <div><h3 class="sec">${esc(ph.nextLabel)}</h3>${critList(ph.next, st)}${(i>=P0.phases.length-2)?'<p class="small" style="margin:6px 0 0">La batería de saltos (≥ 90 %) también cuenta; se evalúa en la app de pruebas.</p>':''}</div>
    ${ph.extra?`<div><h3 class="sec">${esc(ph.extra.label)}</h3>${critList(ph.extra.list, st)}${refList(ph.extra.ev)}</div>`:''}
  </div>
  ${refList(['silbernagel','breda','grindem','aspetar','exp'])}</section>
  ${mods.length?`<section class="card"><h3 class="sec">Consideraciones de este caso</h3><div class="mods" style="margin:0">${mods.join('')}</div></section>`:''}
  ${mesoCard(st)}
  <section class="card"><h3 class="sec">Semana tipo</h3>${overview}
    <div class="legend" style="margin-top:10px">${[['Terapia y activación','var(--green)'],['Rehabilitación','var(--purple)'],['Deporte','var(--blue)'],['Fuerza','var(--coral)'],['Core','var(--ink)'],['Cardio','var(--gold)']].map(([l,c])=>`<span><i class="sw" style="background:${c}"></i>${l}</span>`).join('')}</div>

/* ===================== VISTA: SESIONES Y EVOLUCIÓN ===================== */
const PROMS = {
  aclrsi:{l:'ACL-RSI', ref:'webster08'}, ikdc:{l:'IKDC subjetivo', ref:'irrgang01'}, koos:{l:'KOOS deporte', ref:'roos98'},
  visap:{l:'VISA-P', ref:'visentini98'}, akps:{l:'AKPS (Kujala)', ref:'kujala93'}
};
function promsFor(s){ if(s.cond==='lca') return ['aclrsi','ikdc','koos']; if(s.cond==='men') return ['koos','ikdc']; if(s.cond==='tend') return ['visap']; return ['akps']; }
function weeklyLoad(){
  const by={}; sessions.forEach(x=>{ const w=num(x.semana)||0; if(!by[w]) by[w]={load:0,n:0,pain:[]}; by[w].load+=(num(x.min)||0)*(num(x.srpe)||0); by[w].n++; if(num(x.dolor)!=null) by[w].pain.push(+x.dolor); });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).slice(-8).map(w=>({w, ...by[w]}));
}
function loadChart(){
  const data=weeklyLoad(); if(!data.length) return '<p class="small">Aún no hay sesiones registradas.</p>';
  const max=Math.max(...data.map(d=>d.load),1), W=560, H=170, pad=34, bw=Math.min(48,(W-pad-10)/data.length-10);
  const step=(W-pad-10)/data.length;
  const ticks=[0,0.5,1].map(f=>Math.round(max*f));
  return `<div class="tbl"><svg viewBox="0 0 ${W} ${H+34}" width="100%" style="max-width:${W}px;min-width:360px" role="img" aria-label="Carga interna semanal">
    ${ticks.map(t=>{ const y=H-(t/max)*(H-20); return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-6}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--muted)">${t}</text>`; }).join('')}
    ${data.map((d,k)=>{ const h=(d.load/max)*(H-20), x=pad+k*step+(step-bw)/2, y=H-h; const avg=d.pain.length?(d.pain.reduce((a,b)=>a+b,0)/d.pain.length):null;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${k===data.length-1?'var(--coral)':'var(--coral-soft)'}" stroke="var(--coral)"/>
      <text x="${x+bw/2}" y="${y-5}" font-size="10" text-anchor="middle" fill="var(--ink)">${Math.round(d.load)}</text>
      <text x="${x+bw/2}" y="${H+14}" font-size="10" text-anchor="middle" fill="var(--muted)">S${d.w}</text>
      <text x="${x+bw/2}" y="${H+28}" font-size="9" text-anchor="middle" fill="var(--muted)">${d.n} ses · dolor ${avg==null?'—':avg.toFixed(1)}</text>`; }).join('')}
  </svg></div>`;
}
function adherence(){
  const w=num(st.semPlan)||1, n=st.dias==='4'?4:3;
  const cur=sessions.filter(x=>num(x.semana)===w).length;
  const last4=[w-3,w-2,w-1,w].filter(x=>x>=1); const done=sessions.filter(x=>last4.includes(num(x.semana))).length;
  return {cur, n, pct4: last4.length? Math.round(done/(last4.length*n)*100) : null};
}

}

    ${ses.length?`<div class="tbl"><table class="data"><thead><tr><th>Fecha</th><th>Semana</th><th>Día</th><th>Min</th><th>RPE</th><th>Carga</th><th>Dolor</th><th>24 h</th><th>Ejercicios</th><th></th></tr></thead><tbody>

    </tbody></table></div>`:'<p class="small">Registra sesiones desde cada día del plan con "Registrar sesión".</p>'}
  </section>
  <section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 class="sec" style="margin:0">Evaluaciones y cuestionarios</h3>${!evalOpen?'<button class="dark" id="bEval">Nueva evaluación</button>':''}</div>
    ${evalOpen?evalForm():''}
    ${evs.length?`<div class="tbl" style="margin-top:10px"><table class="data"><thead><tr><th>Fecha</th><th>Semana</th><th>Fase</th><th>Dolor</th><th>Derrame</th><th>Flexión</th><th>Déf. ext.</th>${pf.map(k=>`<th>${PROMS[k].l}</th>`).join('')}<th></th></tr></thead><tbody>
    ${evs.map((e,k)=>`<tr><td>${esc(e.fecha)}</td><td>${esc(e.semana??'—')}</td><td>${esc(e.fase)}</td><td>${esc(e.dolor)}/10</td><td>${der[e.der]??'—'}</td><td>${e.flex??'—'}°</td><td>${e.ext??'—'}°</td>${pf.map(p=>{ const v=e.prom?.[p], pv=k>0?evs[k-1].prom?.[p]:null; const dlt=(v!=null&&pv!=null)?v-pv:null; return `<td>${v??'—'}${dlt!=null?` <span class="${dlt>=0?'up':'down'}">${dlt>=0?'+':''}${dlt}</span>`:''}</td>`; }).join('')}<td>${curId?`<button class="xbtn" data-delev="${esc(e.id)}" aria-label="Borrar evaluación">×</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="small" style="margin-top:8px">Aún no hay evaluaciones.</p>'}
    <p class="small">La app guarda los puntajes; aplica cada cuestionario en su versión validada en español y usa sus propios puntos de corte.</p>
    ${refList(pf.map(k=>PROMS[k].ref))}
  </section>`;
}

    <p class="small">RPE 8 = podrías hacer 2 repeticiones más. RPE 7 = 3 más.</p>${c.evitar?`<p class="small"><b>Evita por ahora:</b> ${esc(c.evitar)}</p>`:''}
    ${c.tools?.length?`<ul class="small" style="margin:6px 0 0;padding-left:18px">${c.tools.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</section>
  ${c.dias.map((d,di)=>`<section class="card day" style="padding:12px"><div class="dayhead"><h3>${esc(d.name.toUpperCase())}</h3><button class="lbtn" data-alog="${di}">${A.open===di?'Cerrar':'Registrar sesión'}</button></div>
    ${A.open===di?logForm(d,di).replace('id="lfSave"','id="aSave"').replace('id="lfCancel"','id="aCancel"'):''}
    ${d.segs.map(sg=>`<div class="blk t-${sg.type}"><div class="bh"><b>${esc(SEGS[sg.type]||sg.type)}</b><i>${esc(sg.sub||'')}</i></div>
      <div class="tbl"><table class="pl"><thead><tr><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Carga</th><th>Nota</th></tr></thead><tbody>${sg.rows.map(aRow).join('')}</tbody></table></div></div>`).join('')}
  </section>`).join('')}
  <section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 class="sec" style="margin:0">Pedir un cambio</h3>${!A.reqOpen?'<button class="dark" id="aReq">Nueva solicitud</button>':''}</div>
    ${A.reqOpen?`<div class="logf"><label class="f">¿Qué necesitas cambiar y por qué?<textarea id="aReqTxt" maxlength="2000" placeholder="Ej.: la sentadilla búlgara me da dolor 6/10 en la rótula"></textarea></label><div class="actions"><button class="primary" id="aReqSend">Enviar</button><button id="aReqCancel">Cancelar</button></div></div>`:''}
    ${solicitudes.length?solicitudes.map(r=>`<div class="req"><div class="reqh">${est[r.estado]||''}<span class="small">${esc((r.created_at||'').slice(0,10))}</span></div><p>${esc(r.texto)}</p>${r.respuesta?`<p class="small"><b>Respuesta:</b> ${esc(r.respuesta)}</p>`:''}</div>`).join(''):'<p class="small">No has enviado solicitudes.</p>'}
  </section>
  <section class="card"><h3 class="sec">Mis sesiones</h3>
    ${mine.length?`<div class="tbl"><table class="data"><thead><tr><th>Fecha</th><th>Día</th><th>Min</th><th>RPE</th><th>Dolor</th><th>24 h</th><th></th></tr></thead><tbody>
    ${mine.map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.dia||'')}</td><td>${esc(x.min??'')}</td><td>${esc(x.srpe??'')}</td><td>${x.dolor!=null?esc(x.dolor)+'/10':'—'}</td><td>${esc({mejor:'Mejor',igual:'Basal',peor:'Peor'}[x.d24]||'—')}</td><td>${x.autor==='deportista'?`<button class="xbtn" data-adel="${esc(x.id)}" aria-label="Borrar sesión">×</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="small">Aún no has registrado sesiones. Usa "Registrar sesión" en el día que entrenaste.</p>'}
  </section>
  <footer class="foot">Tus datos solo los ves tú y tu fisioterapeuta.</footer>`;
}
async function startAthlete(p){
  A.p=p; $('#login').hidden=true; $('#fisioApp').hidden=true; $('#athleteApp').hidden=false;
  const [pl, se, so] = await Promise.all([
    sb.from('planes').select('*').eq('paciente_id',p.id).order('publicado_at',{ascending:false}).limit(1),
    sb.from('sesiones').select('*').eq('paciente_id',p.id).order('fecha',{ascending:false}),
    sb.from('solicitudes').select('*').eq('paciente_id',p.id).order('created_at',{ascending:false})
  ]);
  A.plan=(pl.data||[])[0]||null; sessions=se.data||[]; solicitudes=so.data||[]; st.dolor=0;
  renderAthlete();
}
$('#athleteApp').addEventListener('click', async e=>{
  const q=s=>e.target.closest(s); let b;
  if(q('#aOut')){ await sb.auth.signOut(); location.reload(); return; }
  if((b=q('[data-alog]'))){ const d=+b.dataset.alog; A.open = A.open===d?null:d; renderAthlete(); return; }
  if(q('#aCancel')){ A.open=null; renderAthlete(); return; }
  if(q('#aSave')){
    const day=A.plan.contenido.dias[A.open];
    const row=Object.assign(collectLog(day), {paciente_id:A.p.id, semana:A.plan.contenido.semana, fase:(A.plan.contenido.fase||'').split(' · ')[0], autor:'deportista', created_by:me.uid});
    const {data,error}=await sb.from('sesiones').insert(row).select('*').single();
    if(error){ toast('No se pudo guardar la sesión. Inténtalo de nuevo.'); return; }
    sessions.unshift(data); A.open=null; renderAthlete(); toast('Sesión guardada. ¡Buen trabajo!'); return;
  }
  if((b=q('[data-adel]'))){ const id=b.dataset.adel; const {error}=await sb.from('sesiones').delete().eq('id',id); if(error){ toast('No se pudo borrar.'); return; } sessions=sessions.filter(x=>x.id!==id); renderAthlete(); return; }
  if(q('#aReq')){ A.reqOpen=true; renderAthlete(); $('#aReqTxt')?.focus(); return; }
  if(q('#aReqCancel')){ A.reqOpen=false; renderAthlete(); return; }
  if(q('#aReqSend')){
    const t=($('#aReqTxt').value||'').trim(); if(!t){ toast('Escribe qué necesitas cambiar.'); return; }
    const {data,error}=await sb.from('solicitudes').insert({paciente_id:A.p.id, plan_id:A.plan?.id||null, texto:t.slice(0,2000)}).select('*').single();
    if(error){ toast('No se pudo enviar la solicitud.'); return; }
    solicitudes.unshift(data); A.reqOpen=false; renderAthlete(); toast('Solicitud enviada a tu fisioterapeuta'); return;
  }
});

/* ===================== ACCESO ===================== */
function showLogin(msg){
  $('#login').hidden=false; $('#fisioApp').hidden=true; $('#athleteApp').hidden=true;
  if(msg) $('#loginMsg').innerHTML=msg;
}
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const email=($('#loginEmail').value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('#loginMsg').textContent='Escribe un correo válido.'; return; }
  $('#loginBtn').disabled=true; $('#loginMsg').textContent='Enviando…';
  const {error}=await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname}});
  $('#loginBtn').disabled=false;
  $('#loginMsg').textContent = error ? (/rate/i.test(error.message)?'Se enviaron demasiados correos. Espera unos minutos e inténtalo de nuevo.':'No se pudo enviar el enlace. Inténtalo de nuevo.') : `Listo. Revisa ${email} y abre el enlace desde este mismo dispositivo.`;
});
async function route(session){
  me.email=(session.user.email||'').toLowerCase(); me.uid=session.user.id;
  const {data:f}=await sb.from('fisios').select('email,nombre').maybeSingle();
  if(f){ me.role='fisio'; $('#login').hidden=true; $('#athleteApp').hidden=true; $('#fisioApp').hidden=false; $('#who').textContent=me.email;
    await Promise.all([loadPatients(), loadLib()]);
    if(patients.length) openPatient(patients[0].id); else { render(); renderSel(); }
    return; }
  const {data:p}=await sb.from('pacientes').select('id,nombre').maybeSingle();
  if(p){ me.role='deportista'; startAthlete(p); return; }
  showLogin(`Entraste como <b>${esc(me.email)}</b>, pero este correo no tiene un plan asignado. Pídele a tu fisioterapeuta que te registre con este correo. <button id="lgOut" class="mini-btn">Usar otro correo</button>`);
  const lo=$('#lgOut'); if(lo) lo.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
}
$('#fOut').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
let routed=false;
async function boot(){
  sb.auth.onAuthStateChange((ev, session)=>{ if(session && !routed && (ev==='SIGNED_IN'||ev==='INITIAL_SESSION')){ routed=true; route(session); } });
  const {data:{session}} = await sb.auth.getSession();
  if(session && !routed){ routed=true; route(session); } else if(!session) showLogin();
}

/* ===================== PDF ===================== */
const clean = t => String(t??'').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->').replace(/×/g,'x').replace(/[–—]/g,'-').replace(/≈/g,'~').replace(/·/g,'-').replace(/[“”]/g,'"');
async function pdf(){
  if(!window.jspdf){ toast('No se pudo cargar el generador de PDF.'); return; }
  const key=pkey(st), P0=P[key], ph=P0.phases[phaseIdx(st)], days=applyMeso(baseWeek(st).days, st), m=mesoWeek(st);
  const doc=new jspdf.jsPDF({unit:'mm',format:'a4'}); const W=210, H=297, M=14; let y=0;
  const C={cream:[240,238,233], ink:[28,27,25], mut:[107,104,98], line:[224,221,214], coral:[204,77,44], green:[61,138,106], gold:[160,120,40], purple:[107,66,184], blue:[47,111,159], dark:[36,35,31], white:[255,255,255]};
  const TC={ter:C.green, afe:C.purple, esp:C.blue, sano:C.coral, sup:C.coral, core:C.ink, cardio:C.gold};
  const bg=()=>{ doc.setFillColor(...C.cream); doc.rect(0,0,W,H,'F'); };
  const newPage=()=>{ doc.addPage(); bg(); y=14; };
  const need=h=>{ if(y+h>H-12) newPage(); };
  bg();
  doc.setFillColor(...C.dark); doc.rect(0,0,W,30,'F'); doc.setFillColor(...C.coral); doc.rect(0,30,W,1.6,'F');
  doc.setTextColor(...C.white); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.text('FISIOTERAPEUTA MANUEL CELIS', M, 9);
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.text(clean((st.nombre||'Deportista').toUpperCase()), M, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(clean(`${subLabel(st,P0)} - rodilla ${st.lado==='der'?'derecha':'izquierda'}${st.deporte?' - '+st.deporte:''} - ${days.length} dias por semana`), M, 25);
  const badge=`SEMANA ${num(st.semPlan)||1}`; doc.setFont('helvetica','bold'); doc.setFontSize(10); const bw=doc.getTextWidth(badge)+8;
  doc.setFillColor(...C.coral); doc.roundedRect(W-M-bw, 8, bw, 8, 1.5, 1.5, 'F'); doc.setTextColor(...C.white); doc.text(badge, W-M-bw+4, 13.4);
  const b2=clean(`S${m.w} - ${m.l}`.toUpperCase()); doc.setFontSize(8); const bw2=doc.getTextWidth(b2)+6; doc.setDrawColor(...C.white); doc.roundedRect(W-M-bw2, 19, bw2, 6.5, 1.2, 1.2, 'S'); doc.text(b2, W-M-bw2+3, 23.4);
  y=40;
  const para=(t,size,style,color,indent=0,gap=1.2)=>{ doc.setFont('helvetica',style); doc.setFontSize(size); doc.setTextColor(...color); doc.splitTextToSize(clean(t), W-2*M-indent).forEach(l=>{ need(size*0.45); doc.text(l, M+indent, y); y+=size*0.42; }); y+=gap; };
  para(ph.name.toUpperCase(),12,'bold',C.ink); para(ph.goal,9.5,'normal',C.mut,0,2.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.8);
  const rl=doc.splitTextToSize(clean(`Regla de dolor: dolor durante <= 3/10 y vuelta a basal a las 24 h -> progresar. 4-5/10 -> mantener. Mas de 5/10 o peor al dia siguiente -> bajar carga. RPE 8 = podria hacer 2 repeticiones mas. Esta semana: ${m.l.toLowerCase()} (${m.d})`), W-2*M-8);
  const rb=y; doc.setFillColor(...C.white); doc.setDrawColor(...C.line); doc.rect(M, rb, W-2*M, rl.length*3.8+5, 'FD'); doc.setFillColor(...C.coral); doc.rect(M, rb, 1.5, rl.length*3.8+5, 'F'); doc.setTextColor(...C.ink); rl.forEach((l,k)=>doc.text(l, M+5, rb+5+k*3.8)); y=rb+rl.length*3.8+10;
  if(ph.avoid) para('Evitar: '+ph.avoid,8.8,'italic',C.mut,0,3);
  const cols=[{k:'e',t:'EJERCICIO',w:58},{k:'s',t:'SERIES',w:15},{k:'r',t:'REPS',w:26},{k:'c',t:'CARGA',w:24},{k:'n',t:'NOTA',w:W-2*M-123}];
  days.forEach(d=>{
    need(30);
    doc.setFillColor(...C.dark); doc.roundedRect(M, y, W-2*M, 9, 1.5, 1.5, 'F'); doc.setTextColor(...C.white); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(clean(d.name.toUpperCase()), M+4, y+6.2); y+=13;
    d.segs.forEach(sg=>{
      if(!sg.rows.length) return;
      need(22);
      const col=TC[sg.type]||C.ink;
      doc.setFillColor(...col); doc.rect(M, y, 1.8, 6, 'F'); doc.setTextColor(...col); doc.setFont('helvetica','bold'); doc.setFontSize(9.2);
      doc.text(clean((SEGS[sg.type]||sg.type).toUpperCase()), M+4, y+4.3);
      if(sg.sub){ doc.setFont('helvetica','normal'); doc.setTextColor(...C.mut); doc.setFontSize(8); doc.text(clean(sg.sub), W-M, y+4.3, {align:'right'}); }
      y+=8;
      doc.setFillColor(...C.white); doc.rect(M, y, W-2*M, 6, 'F'); doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...C.mut);
      let x=M; cols.forEach(c=>{ doc.text(c.t, x+2, y+4); x+=c.w; }); y+=6;
      sg.rows.forEach((r,ri)=>{
        const cue=cueOf(r.e); const vid=videoOf(r.e);
        const vals={...r, n:[r.n, cue && sg.type!=='ter' ? 'Clave: '+cue : ''].filter(Boolean).join(' ')};
        const cell = cols.map(c=>{ doc.setFont('helvetica', c.k==='e'||c.k==='c'?'bold':'normal'); doc.setFontSize(c.k==='n'?7.6:8.4); return doc.splitTextToSize(clean(vals[c.k]||''), c.w-4); });
        const h=Math.max(...cell.map(l=>l.length))*3.5+3.2;
        need(h);
        doc.setFillColor(...(ri%2?[250,249,246]:C.white)); doc.rect(M, y, W-2*M, h, 'F');
        doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, y, W-M, y);
        let xx=M; cols.forEach((c,ci)=>{ doc.setFont('helvetica', c.k==='e'||c.k==='c'?'bold':'normal'); doc.setFontSize(c.k==='n'?7.6:8.4);
          doc.setTextColor(...(c.k==='c'?C.coral:c.k==='n'?C.mut:(c.k==='e'&&vid?C.blue:C.ink)));
          cell[ci].forEach((l,li)=>doc.text(l, xx+2, y+4.2+li*3.5));
          if(c.k==='e'&&vid){ doc.link(xx, y, c.w, h, {url:vid}); }
          xx+=c.w; });
        y+=h;
      });
      y+=4;
    });
    y+=3;
  });
  const tools=[];
  if(ph.tools.includes('iso')) tools.push('Isometria: 5 x 45 s con la rodilla a 60 grados (RPE 6-7), antes de entrenar o si duele.');
  if(ph.tools.includes('bfr')) tools.push('BFR (solo supervisado y con manguito): 30-15-15-15 reps con carga muy ligera, 30 s de pausa.');
  if(ph.tools.includes('mi')) tools.push('Imagineria y observacion de video: 10-15 min, 3-5 veces por semana en casa.');
  if(tools.length){ need(16); para('COMPLEMENTOS',10,'bold',C.ink,0,1); tools.forEach(t=>para('- '+t,8.8,'normal',C.ink,0,0.6)); y+=2; }
  if(st.notas){ need(14); para('NOTAS',10,'bold',C.ink,0,1); para(st.notas,8.8,'normal',C.ink); }
  if(days.some(d=>d.segs.some(sg=>sg.rows.some(r=>videoOf(r.e))))) para('Los ejercicios en azul tienen video: toca el nombre para abrirlo.',8,'italic',C.mut,0,1);
  const blob = doc.output('blob');
  const fname = `Plan rodilla - ${(st.nombre||'deportista').replace(/[^\p{L}\p{N} _-]/gu,'')} - semana ${num(st.semPlan)||1}.pdf`;
  try{
    saveBlob(blob, fname); toast('PDF listo');
  }catch(e){ if(e?.code!=='declined') toast('No se pudo descargar el PDF.'); }
}


/* ===================== EXCEL ===================== */
async function excel(){
  if(!window.XLSX){ toast('No se pudo cargar el generador de Excel.'); return; }
  const key=pkey(st), P0=P[key], i=phaseIdx(st), ph=P0.phases[i], days=applyMeso(baseWeek(st).days, st), m=mesoWeek(st);
  const COLOR={ter:'#3D8A6A',afe:'#6B42B8',esp:'#2F6F9F',sano:'#CC4D2C',sup:'#CC4D2C',core:'#1C1B19',cardio:'#A07828'};
  // Hoja 1: plan en formato tabla
  const rows=[['Día','Bloque','Detalle del bloque','Color del bloque','Ejercicio','Series','Reps','Carga','Nota','Clave técnica','Video']];
  days.forEach(d=>d.segs.forEach(sg=>sg.rows.forEach(r=>{
    rows.push([d.name, SEGS[sg.type]||sg.type, sg.sub||'', COLOR[sg.type]||'', r.e, r.s, r.r, r.c, r.n, cueOf(r.e), videoOf(r.e)]);
  })));
  const ws1=XLSX.utils.aoa_to_sheet(rows);
  ws1['!cols']=[{wch:8},{wch:30},{wch:26},{wch:11},{wch:42},{wch:8},{wch:22},{wch:12},{wch:50},{wch:45},{wch:30}];
  ws1['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:10}})};
  // Hoja 2: datos del deportista y de la fase
  const crit = ph.next.map(id=>{ const v=critVal(id,st); return [CR[id].t, v===true?'Cumple':v===false?'No cumple':'Sin dato']; });
  const info=[
    ['Campo','Valor'],
    ['Fisioterapeuta','Manuel Celis'],
    ['Deportista', st.nombre||''],
    ['Deporte', st.deporte||''],
    ['Condición', subLabel(st,P0)],
    ['Rodilla', st.lado==='der'?'Derecha':'Izquierda'],
    ['Fase', ph.name],
    ['Objetivo de la fase', ph.goal],
    ['Semana del plan', num(st.semPlan)||1],
    ['Semana del mesociclo', `S${m.w} · ${m.l} — ${m.d}`],
    ['Días por semana', days.length],
    ['Regla de dolor','Dolor ≤ 3/10 y vuelta a basal a las 24 h → progresar. 4–5/10 → mantener. Más de 5/10 o peor al día siguiente → bajar carga.'],
    ['Escala de carga','RPE 8 = podría hacer 2 repeticiones más; RPE 7 = 3 más.'],
    ['Evitar en esta fase', ph.avoid||''],
    ['Notas', st.notas||''],
    [],
    [ph.nextLabel,'Estado'],
    ...crit
  ];
  const ws2=XLSX.utils.aoa_to_sheet(info); ws2['!cols']=[{wch:28},{wch:90}];
  // Hoja 3: guía de diseño para Claude Design
  const guide=[
    ['Elemento','Valor'],
    ['Fondo','#F0EEE9 (crema)'],
    ['Barra lateral y acento','#CC4D2C (coral)'],
    ['Cabecera de día','#24231F (oscuro), texto blanco'],
    ['Tipografía de títulos','Oswald, mayúsculas'],
    ['Tipografía de texto','DM Sans'],
    ['Columnas de la tabla','Ejercicio / Series / Reps / Carga / Nota'],
    ['Días','Día 1, Día 2… sin fechas'],
    ['Insignia','SEMANA '+(num(st.semPlan)||1)],
    [],
    ['Bloque','Color'],
    ...Object.keys(COLOR).map(k=>[SEGS[k], COLOR[k]])
  ];
  const ws3=XLSX.utils.aoa_to_sheet(guide); ws3['!cols']=[{wch:30},{wch:50}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'Plan');
  XLSX.utils.book_append_sheet(wb, ws2, 'Deportista y fase');
  XLSX.utils.book_append_sheet(wb, ws3, 'Guía de diseño');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const fname=`Plan rodilla - ${(st.nombre||'deportista').replace(/[^\p{L}\p{N} _-]/gu,'')} - semana ${num(st.semPlan)||1}.xlsx`;
  try{
    saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), fname); toast('Excel listo');
  }catch(e){ if(e?.code!=='declined') toast(e?.code==='extension_not_enabled'?'La descarga de Excel no está habilitada en esta vista.':'No se pudo descargar el Excel.'); }
}
