<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ápex</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ápex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/ios.css">
<link rel="stylesheet" href="css/hoy.css">


</head>
<body>
<div id="login" class="login" hidden>
  <div class="logcard">
    <div class="brand"><img class="mark" src="icons/icon.svg" alt=""><div class="lt"><h1>Ápex</h1></div></div>
    <form id="loginForm" class="lgform" novalidate>
      <div class="rolesel" role="radiogroup" aria-label="Entrar como">
        <button type="button" role="radio" data-role="fisio" aria-checked="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>Fisioterapeuta</button>
        <button type="button" role="radio" data-role="deportista" aria-checked="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M10 22l2-7 3 3v4M7 12l3-3 4 1 3 3M12 15l-2-6"/></svg>Deportista</button>
      </div>
      <div class="lghead"><h2 id="lgTitle">Entrar</h2><p id="lgSub"></p></div>
      <label class="f">Correo<input type="email" id="loginEmail" autocomplete="username" inputmode="email" required></label>
      <label class="f" id="pwWrap">Contraseña
        <span class="pw"><input type="password" id="loginPass" autocomplete="current-password">
        <button type="button" class="eye" id="pwEye" aria-label="Mostrar contraseña" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
      </label>
      <button class="primary big" id="loginBtn" type="submit">Entrar</button>
      <button type="button" class="linkbtn" id="lgMode">¿Primera vez u olvidaste tu contraseña?</button>
      <p class="lgmsg" id="loginMsg" role="status" aria-live="polite"></p>
    </form>
    <form id="pwdForm" class="lgform" hidden novalidate>
      <div class="lghead"><h2>Crea tu contraseña</h2><p>Así entras directo la próxima vez, sin esperar correos.</p></div>
      <label class="f">Nueva contraseña<span class="pw"><input type="password" id="newPass" autocomplete="new-password" minlength="8">
        <button type="button" class="eye" id="npEye" aria-label="Mostrar contraseña" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
      <div class="pwmeter" aria-hidden="true"><i id="pwBar"></i></div>
      <p class="pwhint" id="pwHint">Mínimo 8 caracteres.</p>
      <label class="f">Repítela<input type="password" id="newPass2" autocomplete="new-password"></label>
      <button class="primary big" id="pwdBtn" type="submit">Guardar y entrar</button>
      <button type="button" class="linkbtn" id="pwdSkip">Ahora no</button>
      <p class="lgmsg" id="pwdMsg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
<div id="athleteApp" class="wrap" hidden></div>
<div id="fisioApp" hidden>
<div class="wrap">
<header class="top">
  <div class="brand"><img class="mark" src="icons/icon.svg" alt=""><div class="lt"><h1>Ápex</h1></div></div>
  <div class="pbar">
    <button id="bHome" class="homebtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</button>
    <span class="savestate" id="saveState"></span>
    <span class="small" id="who"></span><button id="bAlert" class="bell" aria-expanded="false" aria-controls="alertPanel" aria-label="Alertas de dolor"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="alertN" class="bn" hidden>0</span></button><button id="fOut">Salir</button>
    <div id="alertPanel" class="alpanel" hidden></div>
    <select id="psel" aria-label="Paciente"></select>
    <button id="bNew">Nuevo paciente</button>
    <button id="bDel">Eliminar</button>
  </div>
</header>
<div id="delConfirm" hidden class="confirm"><span id="delTxt"></span><button id="bDelYes" class="primary">Sí, eliminar</button><button id="bDelNo">Cancelar</button></div>
<div id="home" class="home" hidden></div>

<div class="grid" id="work">
<aside class="form" id="form">
  <fieldset>
    <legend>Módulo</legend>
    <div class="modsel" role="group" aria-label="Módulo"><button type="button" data-mod="rodilla">Rehab</button><button type="button" data-mod="deporte">Deporte</button><button type="button" data-mod="salud">Salud</button></div>
    <div class="regsel" role="group" aria-label="Región de rehabilitación" data-modshow="rodilla lumbar"><button type="button" data-reg="rodilla">Rodilla</button><button type="button" data-reg="lumbar">Lumbar</button></div>
  </fieldset>
  <hr class="s">
  <fieldset>
    <legend>Persona</legend>
    <label class="f">Nombre<input type="text" id="nombre" data-k="nombre"></label>
    <label class="f">Correo del deportista (para entrar a su portal)<input type="email" id="pemail" data-k="email" autocomplete="off"></label>
    <div class="row2">
      <label class="f">Deporte<input type="text" id="deporte" data-k="deporte"></label>
      <label class="f" data-modshow="rodilla">Rodilla afectada<select id="lado" data-k="lado"><option value="der">Derecha</option><option value="izq">Izquierda</option></select></label>
    </div>
    <label class="f" data-modshow="rodilla">Perfil deportivo para el retorno<select id="perfil" data-k="perfil"><option value="">Sin perfil específico</option><option value="uwr">Rugby subacuático</option><option value="futbol">Fútbol</option><option value="cancha">Baloncesto o voleibol</option><option value="carrera">Carrera</option><option value="natacion">Natación</option></select></label>
    <label class="chk"><input type="checkbox" id="consent" data-k="consent"> Consentimiento informado para tratar datos de salud firmado</label>
    <div class="small" id="pidRow"></div>
  </fieldset>
  <hr class="s" data-modshow="lumbar">
  <fieldset data-modshow="lumbar">
    <legend>Diagnóstico lumbar</legend>
    <label class="f">Condición<select id="lumCond" data-k="lumCond">
      <option value="agudo">Dolor lumbar agudo o subagudo (&lt; 12 semanas)</option>
      <option value="cronico">Dolor lumbar crónico (&gt; 12 semanas)</option>
      <option value="radic">Con radiculopatía (ciática)</option>
      <option value="postop">Postoperatorio de discectomía</option>
      <option value="espond">Espondilólisis en deportista</option></select></label>
    <div class="row2">
      <label class="f">Semanas desde el inicio o la cirugía<input type="number" id="lumSem" data-k="lumSem" min="0" max="520"></label>
      <label class="f">STarT Back<select id="lumStart" data-k="lumStart"><option value="">Sin evaluar</option><option value="bajo">Riesgo bajo</option><option value="medio">Riesgo medio</option><option value="alto">Riesgo alto</option></select></label>
    </div>
    <label class="f">Preferencia direccional<select id="lumDP" data-k="lumDP"><option value="">Ninguna o sin evaluar</option><option value="ext">Extensión (centraliza al extender)</option><option value="flex">Flexión</option><option value="lat">Desplazamiento lateral</option></select></label>
    <label class="chk"><input type="checkbox" id="lumRF" data-k="lumRF"> Banderas rojas descartadas (cauda equina, déficit progresivo, fractura, cáncer, infección)</label>
  </fieldset>
  <hr class="s" data-modshow="lumbar">
  <fieldset data-modshow="lumbar">
    <legend>Estado clínico hoy</legend>
    <div class="row2">
      <label class="f">Dolor lumbar (0–10)<input type="number" id="lumDolor" data-k="lumDolor" min="0" max="10"></label>
      <label class="f">Dolor en la pierna (0–10)<input type="number" id="lumPierna" data-k="lumPierna" min="0" max="10"></label>
    </div>
    <div class="row2">
      <label class="f">Respuesta a las 24 h<select id="lumResp" data-k="lumResp"><option value="">Sin dato</option><option value="mejor">Mejor que basal</option><option value="igual">Vuelve a basal</option><option value="peor">Peor que basal</option></select></label>
      <label class="f">Oswestry (ODI %)<input type="number" id="lumOdi" data-k="lumOdi" min="0" max="100"></label>
    </div>
  </fieldset>
  <hr class="s" data-modshow="rodilla">
  <fieldset data-modshow="rodilla">
    <legend>Diagnóstico</legend>
    <label class="f">Condición<select id="cond" data-k="cond">
      <option value="tend">Tendinopatía</option><option value="pfp">Dolor patelofemoral</option><option value="men">Meniscopatía</option><option value="lca">Ligamento cruzado anterior</option></select></label>
    <label class="f" data-show="tend">Tendón<select id="tendSub" data-k="tendSub"><option value="rot">Rotuliano</option><option value="quad">Cuadricipital</option></select></label>
    <label class="f" data-show="men">Situación<select id="menSub" data-k="menSub">
      <option value="cons">Conservador (sospecha clínica / imagen)</option><option value="mx">Postoperatorio · meniscectomía</option><option value="sut">Postoperatorio · sutura meniscal</option></select></label>
    <label class="f" data-show="sut">Carga indicada por el cirujano<select id="cargaSut" data-k="cargaSut"><option value="restringida">Restringida (4–6 sem)</option><option value="inmediata">Inmediata según tolerancia</option></select></label>
    <label class="f" data-show="lca">Situación<select id="lcaSub" data-k="lcaSub">
      <option value="cons">No operado · manejo conservador</option><option value="pre">Preoperatorio (prehabilitación)</option><option value="post">Postoperatorio</option></select></label>
    <div class="row2" data-show="lcapost">
      <label class="f">Injerto<select id="injerto" data-k="injerto"><option value="hth">Hueso-tendón-hueso</option><option value="isq">Isquiotibiales</option><option value="qt">Tendón cuadricipital</option><option value="allo">Aloinjerto</option></select></label>
      <label class="f">Semanas postop<input type="number" id="semanas" data-k="semanas" min="0" max="104"></label>
    </div>
    <label class="chk" data-show="lcapost"><input type="checkbox" id="suturaAsoc" data-k="suturaAsoc"> Sutura meniscal asociada</label>
    <label class="f" data-show="menpost">Semanas postop<input type="number" id="semanasM" data-k="semanas" min="0" max="104"></label>
  </fieldset>
  <hr class="s">
  <fieldset>
    <legend>Planificación</legend>
    <label class="f" data-modshow="deporte">Deporte para planificar<select id="deporteP" data-k="deporteP"><option value="uwr">Rugby subacuático</option><option value="natacion">Natación</option><option value="futbol">Fútbol</option><option value="carrera">Carrera</option><option value="cancha">Baloncesto o voleibol</option><option value="raqueta">Tenis, pádel o squash</option><option value="gimnasio">Gimnasio o fuerza general</option></select></label>
    <label class="f" data-modshow="salud">Población<select id="poblacion" data-k="poblacion"><option value="sed">Adulto sedentario o que empieza</option><option value="act">Adulto activo</option><option value="may">Adulto mayor (65 años o más)</option></select></label>
    <label class="f" data-modshow="deporte salud">Nivel en fuerza<select id="nivel" data-k="nivel"><option value="ini">Principiante · menos de 1 año</option><option value="int">Intermedio · 1–3 años</option><option value="av">Avanzado · más de 3 años</option></select></label>
    <label class="f">Fase<select id="fase" data-k="fase"></select></label>
    <div class="row2">
      <label class="f">Días por semana<select id="dias" data-k="dias"><option value="2" data-modshow="deporte salud">2 días</option><option value="3">3 días</option><option value="4">4 días</option></select></label>
      <label class="f">Semana del plan<input type="number" id="semPlan" data-k="semPlan" min="1" max="104"></label>
    </div>
    <p class="small" style="margin:0">Torneos, fecha de inicio y semanas de descarga: pestaña Calendario.</p>
    <label class="chk"><input type="checkbox" id="vivoOff" data-k="vivoOff"> Desactivar el modo en vivo en el portal del deportista</label>
  </fieldset>
  <hr class="s" data-modshow="rodilla">
  <fieldset data-modshow="rodilla">
    <legend>Estado clínico hoy</legend>
    <label class="f">Dolor durante la carga (0–10)<span class="rng"><input type="range" id="dolor" data-k="dolor" min="0" max="10" step="1"><output id="dolorOut"></output></span></label>
    <div class="row2">
      <label class="f">Respuesta a las 24 h<select id="resp24" data-k="resp24"><option value="mejor">Mejor que basal</option><option value="igual">Vuelve a basal</option><option value="peor">Peor que basal</option></select></label>
      <label class="f">Derrame (barrido)<select id="derrame" data-k="derrame"><option value="0">Cero</option><option value="1">Trazas</option><option value="2">1+</option><option value="3">2+</option><option value="4">3+</option></select></label>
    </div>
    <div class="row3">
      <label class="f">Déficit ext. (°)<input type="number" id="extDef" data-k="extDef" min="0" max="40"></label>
      <label class="f">Flexión afectada<input type="number" id="flexL" data-k="flexL" min="0" max="170"></label>
      <label class="f">Flexión sana<input type="number" id="flexS" data-k="flexS" min="0" max="170"></label>
    </div>
    <label class="chk"><input type="checkbox" id="slr" data-k="slr"> Elevación de pierna recta sin déficit</label>
    <label class="chk"><input type="checkbox" id="marcha" data-k="marcha"> Marcha sin cojera ni ayudas</label>
  </fieldset>
  <hr class="s">
  <fieldset>
    <legend>Notas</legend>
    <textarea id="notas" data-k="notas" aria-label="Notas clínicas"></textarea>
  </fieldset>
</aside>

<main id="out"></main>
</div>
</div>
</div>
<datalist id="exlib"></datalist>
<div class="toast" id="toast" hidden></div>

<script src="js/datos.js"></script>
<script src="js/banco.js"></script>
<script src="js/plan.js"></script>
<script src="js/modulos.js"></script>
<script src="js/bienestar.js"></script>
<script src="js/vistas.js"></script>
<script src="js/lumbar.js"></script>
<script src="js/rutinas.js"></script>
<script src="js/servidor.js"></script>
<script src="js/fase1.js"></script>
<script src="js/revision.js"></script>
<script src="js/bancoui.js"></script>
<script src="js/exportar.js"></script>
<script src="js/vivo.js"></script>
<script src="js/chequeo.js"></script>
<script src="js/panel.js"></script>
<script src="js/push.js"></script>
<script src="js/offline.js"></script>
<script src="js/movil.js"></script>
<script src="js/hoy.js"></script>
<script src="js/adherencia.js"></script>
<script src="js/inicio.js"></script>


</body>
</html>
